[package]
name = "archae"
version = "0.1.0"
edition = "2021"
rust-version = "1.72"

[dependencies]
anyhow = "1.0.75"
tokio = { version = "1.12.0", features = ["full"] }
clap = { version = "4.4.7", features = ["derive"] }

egui = "0.27.1"
egui_extras = { version = "0.27.1", features = ["default", "image"] }
eframe = "0.27.1"
log = "0.4"

serde = { version = "1", features = ["derive"] }

env_logger = "0.11"

nom = "7.1.3"
numbat = "1.10.1"
fuzzy-matcher = "0.3.7"
itertools = "0.12.1"
chrono = "0.4.35"
dirs = "5.0.1"
emojis = "0.6.1"

egui_autocomplete = "6.0.0"

# probably I want to daemonize properly with this instead of dbus etc
# interprocess = "1.2.1"

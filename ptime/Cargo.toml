[package]
name = "timesheet"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
itertools = "0.10.5"
nom = "7.1.1"
chrono = { version = "0.4.24", features = ["serde"] }
clap = { version = "4.2.4", features = ["derive"]}
serde = { version = "1.0.163", features = ["derive"] }
[dev-dependencies]
tempfile = "3"
temp-env = "0.3.4"

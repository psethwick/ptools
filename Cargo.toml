[package]
name = "yoink-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
clap = { version = "4.5.40", features = ["derive"]}
dirs = "6.0.0"
futures = "0.3.31"
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12.20", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
tokio = "1.45.1"
toml = "0.8.23"
